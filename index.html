<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зубрёжка</title>
    <style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #333; height: 100vh; overflow: hidden; }
body.landscape { background: #000; }
body.landscape #main-wrapper { width: 50vh; margin: 0 auto; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
#main-wrapper { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { height: calc(100vh / 13); min-height: calc(100vh / 13); max-height: calc(100vh / 13); background-color: #4a90e2; color: white; display: flex; align-items: stretch; flex-shrink: 0; }
#back-btn { width: calc(100vh / 13); min-width: calc(100vh / 13); max-width: calc(100vh / 13); height: 100%; background: rgba(255,255,255,0.2); border: none; border-right: 1px solid rgba(255,255,255,0.3); color: white; font-size: calc(100vh / 13 * 0.5); cursor: pointer; display: none; align-items: center; justify-content: center; flex-shrink: 0; }
#back-btn:active { background: rgba(255,255,255,0.4); }
#header-title-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0 10px; }
#header-title { font-weight: bold; text-align: center; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.2; max-width: 100%; font-size: calc(100vh / 13 * 0.5); }
#app { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.menu-list { display: flex; flex-direction: column; flex: 1; }
.menu-item { height: calc(100vh / 13); min-height: calc(100vh / 13); max-height: calc(100vh / 13); background: white; border: none; border-bottom: 1px solid #e0e0e0; font-size: calc(100vh / 13 * 0.5); text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px 15px; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.2; font-weight: 500; }
.menu-item:active { background: #e6e9ef; }
.menu-item:last-child { border-bottom: none; }
.empty-msg { text-align: center; color: #888; font-size: calc(100vh / 13 * 0.5); display: flex; align-items: center; justify-content: center; flex: 1; padding: 20px; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.2; }
#task-container { display: none; flex: 1; overflow: hidden; }
.game-area { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
    </style>
</head>
<body>
<div id="main-wrapper">
    <header>
        <button id="back-btn" onclick="goBack()">←</button>
        <div id="header-title-container">
            <span id="header-title">Выберите класс</span>
        </div>
    </header>
    <div id="app"></div>
    <div id="task-container">
        <div class="game-area" id="game-area"></div>
    </div>
</div>
<script src="curriculum.js"></script>
<script>
    let state = { screen: 'classes' };
    let navStack = [];
    let currentScript = null;

    function saveState() {
        const stateToSave = {
            navStack: navStack,
            state: state,
            timestamp: Date.now()
        };
        if (state.screen === 'task' && typeof window.taskGetState === 'function') {
            stateToSave.taskState = window.taskGetState();
        }
        try {
            localStorage.setItem('zubrilka_state', JSON.stringify(stateToSave));
        } catch (e) {
            console.error('Ошибка сохранения:', e);
        }
    }

    function restoreState() {
        const saved = localStorage.getItem('zubrilka_state');
        if (!saved) return null;
        try {
            const parsed = JSON.parse(saved);
            if (Date.now() - parsed.timestamp > 24 * 60 * 60 * 1000) {
                localStorage.removeItem('zubrilka_state');
                return null;
            }
            return parsed;
        } catch (e) {
            console.error('Ошибка восстановления:', e);
            localStorage.removeItem('zubrilka_state');
            return null;
        }
    }

    function clearSavedState() {
        localStorage.removeItem('zubrilka_state');
    }

    function navigateTo(screen, data = {}) {
        navStack.push({...state});
        state = { screen, ...data };
        render();
        saveState();
    }

    function goBack() {
        const wasInTask = (state.screen === 'task');
        if (typeof window.taskCleanup === 'function') { window.taskCleanup(); window.taskCleanup = null; }
        window.taskGetState = null;
        window.taskIsInMenu = null;
        window.taskShowResultsBeforeExit = null;
        if (currentScript) { document.head.removeChild(currentScript); currentScript = null; }
        const prev = navStack.pop();
        if (prev) { state = prev; render(); }
        else { state = { screen: 'classes' }; render(); }

        if (wasInTask) {
            const stateToSave = {
                navStack: navStack,
                state: state,
                timestamp: Date.now()
            };
            try {
                localStorage.setItem('zubrilka_state', JSON.stringify(stateToSave));
            } catch (e) {
                console.error('Ошибка сохранения:', e);
            }
        } else if (navStack.length === 0 && state.screen === 'classes') {
            clearSavedState();
        } else {
            saveState();
        }
    }

    function openSubjects(classIdx) { navigateTo('subjects', { classIdx }); }
    function openTopics(classIdx, subjectIdx) { navigateTo('topics', { classIdx, subjectIdx }); }
    function startExternalTask(file, initFunc, name) { navigateTo('task', { taskFile: file, initFunc, taskName: name }); }

    function updateOrientation() {
        if (window.innerWidth > window.innerHeight) document.body.classList.add('landscape');
        else document.body.classList.remove('landscape');
    }

    // === ПОДБОР ШРИФТА ДЛЯ МЕНЮ ===
    function fitMenuText() {
        setTimeout(() => {
            const items = document.querySelectorAll('.menu-item');
            if (items.length === 0) return;
            
            items.forEach(item => {
                // Сбрасываем размер к начальному
                item.style.fontSize = '';
                
                // Получаем базовый размер из CSS (вычисленный браузером)
                let fontSize = parseFloat(window.getComputedStyle(item).fontSize);
                const minHeight = item.clientHeight;
                const maxHeight = minHeight; // фиксированная высота строки
                
                // Уменьшаем шрифт пока текст не влезет и по ширине, и по высоте
                let attempts = 0;
                const maxAttempts = 100;
                const minFontSize = 8;
                
                while (attempts < maxAttempts && fontSize > minFontSize) {
                    const fitsWidth = item.scrollWidth <= item.clientWidth;
                    const fitsHeight = item.scrollHeight <= maxHeight;
                    
                    if (fitsWidth && fitsHeight) {
                        break;
                    }
                    
                    fontSize -= 0.5;
                    item.style.fontSize = fontSize + 'px';
                    attempts++;
                }
            });
        }, 10);
    }

    function render() {
        const app = document.getElementById('app');
        const taskContainer = document.getElementById('task-container');
        const gameArea = document.getElementById('game-area');
        const headerTitle = document.getElementById('header-title');
        const backBtn = document.getElementById('back-btn');

        const taskInMenu = (state.screen === 'task' && typeof window.taskIsInMenu === 'function' && window.taskIsInMenu());
        backBtn.style.display = (navStack.length > 0 && (state.screen !== 'task' || taskInMenu)) ? 'flex' : 'none';

        if (state.screen === 'classes') {
            headerTitle.textContent = 'Выберите класс';
            taskContainer.style.display = 'none';
            app.style.display = 'flex';
            let html = '<div class="menu-list">';
            curriculum.forEach((cls, idx) => { html += '<button class="menu-item" onclick="openSubjects(' + idx + ')">' + cls[0] + '</button>'; });
            html += '</div>';
            app.innerHTML = html;
            fitMenuText();

        } else if (state.screen === 'subjects') {
            const classData = curriculum[state.classIdx];
            headerTitle.textContent = classData[0];
            taskContainer.style.display = 'none';
            app.style.display = 'flex';
            const subjects = classData.slice(1);
            if (subjects.length === 0) { app.innerHTML = '<div class="empty-msg">Предметы для этого класса пока не добавлены</div>'; }
            else {
                let html = '<div class="menu-list">';
                subjects.forEach((subj, idx) => { html += '<button class="menu-item" onclick="openTopics(' + state.classIdx + ',' + idx + ')">' + subj[0] + '</button>'; });
                html += '</div>';
                app.innerHTML = html;
                fitMenuText();
            }

        } else if (state.screen === 'topics') {
            const classData = curriculum[state.classIdx];
            const subjectData = classData[state.subjectIdx + 1];
            headerTitle.textContent = subjectData[0];
            taskContainer.style.display = 'none';
            app.style.display = 'flex';
            const topics = subjectData.slice(1);
            if (topics.length === 0) { app.innerHTML = '<div class="empty-msg">Темы пока не добавлены</div>'; }
            else {
                let html = '<div class="menu-list">';
                topics.forEach(topic => {
                    const name = topic[0], file = topic[1], init = topic[2] || 'startTest';
                    html += '<button class="menu-item" onclick="startExternalTask(\'' + file + '\',\'' + init + '\',\'' + name + '\')">' + name + '</button>';
                });
                html += '</div>';
                app.innerHTML = html;
                fitMenuText();
            }

        } else if (state.screen === 'task') {
            headerTitle.textContent = state.taskName;
            app.style.display = 'none';
            taskContainer.style.display = 'flex';
            gameArea.innerHTML = '<div class="empty-msg">Загрузка...</div>';
            if (currentScript) document.head.removeChild(currentScript);
            currentScript = document.createElement('script');
            currentScript.src = state.taskFile;
            currentScript.onload = () => {
                gameArea.innerHTML = '';
                updateOrientation();
                if (typeof window[state.initFunc] === 'function') {
                    window[state.initFunc](gameArea, goBack, null);
                    setTimeout(() => {
                        const taskInMenu = (typeof window.taskIsInMenu === 'function' && window.taskIsInMenu());
                        backBtn.style.display = (navStack.length > 0 && taskInMenu) ? 'flex' : 'none';
                    }, 50);
                } else {
                    gameArea.innerHTML = '<div class="empty-msg">Ошибка: функция ' + state.initFunc + ' не найдена.</div>';
                }
            };
            currentScript.onerror = () => { gameArea.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки: <b>' + state.taskFile + '</b></div>'; };
            document.head.appendChild(currentScript);
        }
    }

    function launchTaskWithState(savedTaskState) {
        const app = document.getElementById('app');
        const taskContainer = document.getElementById('task-container');
        const gameArea = document.getElementById('game-area');
        const headerTitle = document.getElementById('header-title');
        const backBtn = document.getElementById('back-btn');

        headerTitle.textContent = state.taskName;
        app.style.display = 'none';
        taskContainer.style.display = 'flex';
        gameArea.innerHTML = '<div class="empty-msg">Загрузка...</div>';

        if (currentScript) document.head.removeChild(currentScript);
        currentScript = document.createElement('script');
        currentScript.src = state.taskFile;
        currentScript.onload = () => {
            gameArea.innerHTML = '';
            updateOrientation();
            if (typeof window[state.initFunc] === 'function') {
                window[state.initFunc](gameArea, goBack, savedTaskState);
                setTimeout(() => {
                    const taskInMenu = (typeof window.taskIsInMenu === 'function' && window.taskIsInMenu());
                    backBtn.style.display = (navStack.length > 0 && taskInMenu) ? 'flex' : 'none';
                }, 50);
            } else {
                gameArea.innerHTML = '<div class="empty-msg">Ошибка: функция ' + state.initFunc + ' не найдена.</div>';
            }
        };
        currentScript.onerror = () => { gameArea.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки: <b>' + state.taskFile + '</b></div>'; };
        document.head.appendChild(currentScript);
    }

    // === СЕКРЕТНОЕ СОЧЕТАНИЕ: Alt+Delete — сброс всех сохранений и возврат в главное меню ===
    document.addEventListener('keydown', function(e) {
        if (e.altKey && e.key === 'Delete') {
            e.preventDefault();
            console.log('Alt+Delete: сброс всех сохранений');
            localStorage.removeItem('zubrilka_state');
            if (typeof window.taskCleanup === 'function') {
                window.taskCleanup();
                window.taskCleanup = null;
            }
            window.taskGetState = null;
            window.taskIsInMenu = null;
            window.taskShowResultsBeforeExit = null;
            if (currentScript) {
                if (currentScript.parentNode) currentScript.parentNode.removeChild(currentScript);
                currentScript = null;
            }
            state = { screen: 'classes' };
            navStack = [];
            render();
        }
    });

    // === ИНИЦИАЛИЗАЦИЯ ===
    window.addEventListener('resize', updateOrientation);
    window.addEventListener('orientationchange', () => setTimeout(updateOrientation, 100));
    updateOrientation();

    const restored = restoreState();
    if (restored) {
        navStack = restored.navStack || [];
        state = restored.state || { screen: 'classes' };
        if (state.screen === 'task' && restored.taskState) {
            launchTaskWithState(restored.taskState);
        } else {
            render();
        }
    } else {
        render();
    }
</script>
</body>
</html>
