<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-body);font-family:Arial,sans-serif;overflow:hidden;}
#pole{position:absolute;background:var(--bg-pole);box-shadow:0 0 20px rgba(0,0,0,0.4);overflow-y:auto;}
.task-el{position:absolute;overflow:hidden;}
.vopros{padding:2px 4px;line-height:1.2;color:var(--text);display:block;align-items:center;justify-content:center;text-align:center;white-space:normal;word-wrap:break-word;}
.vopros span{white-space:nowrap;display:inline-block;margin-right:0.15em;}
.koment{padding:2px 4px;line-height:1.2;color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;word-wrap:break-word;font-style:italic;}
.koment span{white-space:nowrap;}
.title{padding:2px 4px;line-height:1.2;color:var(--title-text);background:var(--accent);font-weight:normal;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;word-wrap:break-word;flex-wrap:wrap;}
.vvod{padding:4px 8px;line-height:1.2;color:var(--text);background:var(--menu-bg);border:2px solid var(--menu-border);border-radius:4px;display:block;text-align:center;white-space:normal;word-wrap:break-word;word-spacing:0.15em;}
.vvod span{white-space:nowrap;display:inline-block;margin-right:0.15em;}
.vvod span:last-child{margin-right:0;}
.otvet{padding:2px 4px;line-height:1.2;color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;word-wrap:break-word;}
.menu{background:var(--menu-bg);color:var(--menu-text);border:none;border-bottom:2px solid var(--menu-border);cursor:pointer;font-weight:normal;transition:background 0.2s,color 0.2s;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;white-space:normal;word-wrap:break-word;}
.menu:hover{background:var(--accent);color:var(--title-text);}
.menu:active{background:var(--accent-hover);color:var(--title-text);}
.knopki{background:var(--bg-pole);color:var(--text);border:2px solid var(--accent);border-radius:0;cursor:pointer;font-weight:normal;transition:background 0.2s,color 0.2s,border-color 0.2s;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;white-space:normal;word-wrap:break-word;}
.knopki:hover{background:var(--accent);color:var(--title-text);}
.knopki-correct{background:var(--correct) !important;color:var(--title-text) !important;border-color:var(--correct) !important;}
.knopki-wrong{background:var(--wrong) !important;color:var(--title-text) !important;border-color:var(--wrong) !important;}
.task-i{object-fit:contain;display:block;}
.task-tb{border-collapse:collapse;width:100%;height:100%;}
.task-tb th,.task-tb td{border:1px solid var(--text);padding:4px 8px;text-align:left;}
.task-tb th{background:var(--menu-bg);}
.task-hidden{display:none;}
.task-clickable{cursor:pointer;transition:opacity 0.2s,transform 0.1s;}
.task-clickable:hover{opacity:0.8;}
.task-clickable:active{opacity:0.6;transform:scale(0.95);}
.task-i-clickable{cursor:pointer;transition:opacity 0.2s,outline 0.2s,filter 0.2s;outline:4px solid transparent;}
.task-i-clickable:hover{opacity:0.95;outline:6px solid var(--accent);filter:brightness(1.15) drop-shadow(0 0 12px var(--accent));}
.task-i-clickable:active{opacity:0.85;outline:6px solid var(--accent-hover);filter:brightness(0.9) drop-shadow(0 0 15px var(--accent-hover));}
@keyframes overlayPop{from{transform:scale(0.3);opacity:0;}to{transform:scale(1);opacity:1;}}
body.theme-blue{--bg-body:#2c3e50;--bg-pole:#ffffff;--text:#1a3a5c;--accent:#2980b9;--accent-hover:#3498db;--title-text:#ffffff;--menu-bg:#ecf0f1;--menu-text:#2c3e50;--menu-border:#bdc3c7;--hint:#7f8c8d;--correct:#27ae60;--wrong:#e74c3c;}

function fitText(el){
const maxW=el.clientWidth,maxH=el.clientHeight;
if(maxW<=0||maxH<=0)return;
let lo=6,hi=Math.min(maxH*1.2,maxW*2);
while(hi-lo>0.5){
const mid=(lo+hi)/2;
el.style.fontSize=mid+'px';
if(el.scrollWidth<=maxW&&el.scrollHeight<=maxH)lo=mid;
else hi=mid;
}
el.style.fontSize=lo+'px';
}

function renderFractions(el){
if(!el)return;
const html=el.innerHTML;
el.innerHTML=html.replace(/<f>([^<]+)<\/f>/g,(match,content)=>{
const fracRegex=/\(([^)]+)\)\/\(([^)]+)\)|\(([^)]+)\)\/([A-Za-z0-9]+)|([A-Za-z0-9]+)\/\(([^)]+)\)|([A-Za-z0-9]+)\/([A-Za-z0-9]+)/g;
return content.replace(fracRegex,(m,fullNum,fullDen,parenNum,simpleDen,simpleNum,parenDen,num,den)=>{
const numerator=fullNum||parenNum||num;
const denominator=fullDen||simpleDen||parenDen||den;
return`<span class="frac"><span class="frac-num">${numerator}</span><span class="frac-den">${denominator}</span></span>`;
});
});
}
